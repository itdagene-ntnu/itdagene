{% extends "base_admin.html" %}
{% load i18n %}

{% block content %}
    <div class="card card-outline card-primary"><div class="card-body">
        <p>{% blocktrans with year=preference.year %}Create a new draft for the {{ year }} edition. Maps and placements can be edited only while the release remains a draft.{% endblocktrans %}</p>
        <form method="post">{% csrf_token %}<button class="btn btn-primary" type="submit">{% trans "Create draft" %}</button></form>
    </div></div>
{% endblock %}
